<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 会話コンソール</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 16rem 1fr 16rem;
    font-family: system-ui, sans-serif;
    color: #222;
    background: #f6f6f4;
  }
  section { padding: 1rem; overflow-y: auto; }
  h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  #history { border-right: 1px solid #ddd; background: #fff; }
  #status { border-left: 1px solid #ddd; background: #fff; }
  .empty { color: #777; }
</style>
</head>
<body>
  <section id="history">
    <h2>履歴</h2>
    <p class="empty">会話がまだありません</p>
  </section>
  <section id="chat">
    <h2>会話</h2>
  </section>
  <section id="status">
    <h2>サーバの状態</h2>
  </section>
</body>
</html>
