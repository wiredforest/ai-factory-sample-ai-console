<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 会話コンソール</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 16rem 1fr 16rem;
    grid-template-rows: auto 1fr;
    font-family: system-ui, sans-serif;
    color: #222;
    background: #f6f6f4;
  }
  section { padding: 1rem; overflow-y: auto; }
  h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  #history { grid-column: 1; grid-row: 1 / 3; border-right: 1px solid #ddd; background: #fff; }
  #status { grid-column: 3; grid-row: 1 / 3; border-left: 1px solid #ddd; background: #fff; }
  .empty { color: #777; }
  #conversations { list-style: none; margin: 0; padding: 0; }
  #conversations li { display: flex; align-items: flex-start; border-bottom: 1px solid #eee; }
  #conversations .open { display: block; flex: 1; min-width: 0; padding: 0.5rem; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  #conversations li:not([aria-current="true"]) .open:hover { background: #f2f2ef; }
  #conversations li[aria-current="true"] { background: #e3effa; }
  #conversations .delete { margin: 0.5rem 0.25rem; font: inherit; font-size: 0.8rem; }
  #conversations .title { display: block; overflow-wrap: anywhere; }
  #conversations time { font-size: 0.8rem; color: #777; }
  #chat { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #send-failures { grid-column: 2; grid-row: 1; max-height: 40vh; overflow-y: auto; margin: 0; padding: 0.5rem 1rem; list-style: none; background: #fdecea; border-bottom: 1px solid #f3b8b3; }
  #send-failures li { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 0.75rem; padding: 0.5rem 0; }
  #send-failures li + li { border-top: 1px solid #f3b8b3; }
  #send-failures .summary { margin: 0; color: #c62828; font-weight: bold; }
  #send-failures .origin { overflow-wrap: anywhere; }
  #send-failures .text { grid-column: 1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #send-failures .actions { grid-column: 2; grid-row: 1 / 3; align-self: start; display: flex; gap: 0.5rem; }
  #send-failures button { font: inherit; }
  #chat header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; }
  #chat header h2 { margin: 0; }
  #new-conversation { font: inherit; }
  #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-bottom: 0.75rem; }
  .bubble { max-width: 75%; padding: 0.5rem 0.75rem; border-radius: 0.75rem; }
  .bubble .speaker { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.25rem; }
  .bubble .text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble .text > * { margin: 0; }
  .bubble .text > * + * { margin-top: 0.5em; }
  .bubble .text :is(h1, h2, h3, h4, h5, h6) { font-size: 1em; line-height: 1.3; }
  .bubble .text h1 { font-size: 1.5em; }
  .bubble .text h2 { font-size: 1.3em; }
  .bubble .text h3 { font-size: 1.15em; }
  .bubble .text :is(ul, ol) { padding-left: 2em; }
  .bubble .text li > * { margin: 0.25em 0 0; }
  .bubble.user { align-self: flex-end; background: #d7ecff; }
  .bubble.assistant { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
  #messages .error { align-self: flex-end; margin: 0; color: #c62828; font-weight: bold; }
  #composer { display: flex; gap: 0.5rem; }
  #composer textarea { flex: 1; resize: vertical; min-height: 3rem; font: inherit; padding: 0.5rem; }
  #composer button { font: inherit; padding: 0 1rem; }
  #status-items { list-style: none; margin: 0 0 0.75rem; padding: 0; }
  #status-items li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  .state.ok { color: #1a7f37; }
  .state.ng, .status-error, .history-error { color: #c62828; font-weight: bold; }
  #recheck { font: inherit; }
</style>
</head>
<body>
  <section id="history">
    <h2>履歴</h2>
    <p class="empty" hidden>会話がまだありません</p>
    <p class="history-error" hidden>会話の履歴を読めませんでした</p>
    <p class="history-error delete-error" role="alert" hidden>会話を削除できませんでした</p>
    <ul id="conversations"></ul>
  </section>
  <ul id="send-failures" aria-label="別の会話で送れなかったメッセージ" hidden></ul>
  <section id="chat">
    <header>
      <h2>会話</h2>
      <button type="button" id="new-conversation">新しい会話</button>
    </header>
    <div id="messages"></div>
    <form id="composer">
      <textarea name="text" rows="2" placeholder="メッセージを入力 (Enter で送信、Shift+Enter で改行)" aria-label="メッセージ"></textarea>
      <button type="submit">送信</button>
    </form>
  </section>
  <section id="status">
    <h2>サーバの状態</h2>
    <ul id="status-items"></ul>
    <p class="status-error status-unreachable" hidden>サーバに届きません</p>
    <p class="status-error status-unreadable" hidden>状態を読めませんでした</p>
    <button type="button" id="recheck">再確認</button>
  </section>
<script>
  const historyList = document.getElementById("conversations");
  const historyEmpty = document.querySelector("#history .empty");
  const historyError = document.querySelector("#history .history-error");
  const deleteError = document.querySelector("#history .delete-error");
  let historyRequest = 0;
  let openRequest = 0;
  // 最後に開こうとした会話の id。
  let openingId = null;
  // 今の会話の id。一覧を読み直しても、その項目に aria-current を付け直す。
  let currentHistoryId = null;

  function localTime(iso) {
    const at = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${at.getFullYear()}-${pad(at.getMonth() + 1)}-${pad(at.getDate())} ${pad(at.getHours())}:${pad(at.getMinutes())}`;
  }

  async function loadHistory() {
    // 読み直しが重なったら、最後に始めたものの結果だけを出す。
    const request = ++historyRequest;
    let conversations;
    try {
      const response = await fetch("/api/conversations");
      if (!response.ok) throw new Error(`GET /api/conversations: ${response.status}`);
      ({ conversations } = await response.json());
    } catch (error) {
      if (request !== historyRequest) return;
      // 読めなかったのに「まだありません」と出すと、会話が無いのと見分けられない。前の一覧も残さない。
      historyList.replaceChildren();
      historyEmpty.hidden = true;
      historyError.hidden = false;
      throw error;
    }
    if (request !== historyRequest) return;
    historyError.hidden = true;
    historyList.replaceChildren(...conversations.map((conversation) => {
      const item = document.createElement("li");
      item.dataset.conversationId = conversation.id;
      const open = document.createElement("button");
      open.type = "button";
      open.className = "open";
      open.addEventListener("click", () => openConversation(conversation.id));
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = conversation.title;
      const time = document.createElement("time");
      time.dateTime = conversation.updated_at;
      time.textContent = localTime(conversation.updated_at);
      open.append(title, time);
      // 会話を開くボタンとは別のボタン。押しても会話を開かない。
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete";
      remove.textContent = "削除";
      remove.addEventListener("click", () => deleteConversation(conversation, remove));
      item.append(open, remove);
      return item;
    }));
    markCurrent();
    // 会話の送受信は、別の会話で送れなかったことを知らせるときに、この題名でどの会話かを示す。
    document.dispatchEvent(new CustomEvent("history-loaded", {
      detail: { titles: conversations.map(({ id, title }) => ({ conversationId: id, title })) },
    }));
    // 空の表示は、一覧を読み終えてから出す。先に出すと、会話があるのに一瞬「まだありません」と見える。
    historyEmpty.hidden = conversations.length > 0;
  }

  function markCurrent() {
    for (const item of historyList.children) {
      if (Number(item.dataset.conversationId) === currentHistoryId) {
        item.setAttribute("aria-current", "true");
      } else {
        item.removeAttribute("aria-current");
      }
    }
  }

  async function openConversation(conversationId) {
    // 続けて選んだら、最後に選んだ会話だけを開く。
    const request = ++openRequest;
    openingId = conversationId;
    // 会話の送受信は conversation-opening を受けると、開き終わるか開けなかったと分かるまで、送信中の結果を今の会話に出すか決めずに待つ。
    document.dispatchEvent(new CustomEvent("conversation-opening"));
    let id, messages;
    try {
      const response = await fetch(`/api/conversations/${conversationId}`);
      if (!response.ok) throw new Error(`GET /api/conversations/${conversationId}: ${response.status}`);
      ({ id, messages } = await response.json());
    } catch (error) {
      // 開けなかったら会話の領域は前の会話のまま。後から別の会話を選んだり、新しい会話にしたり、その会話を消したりしていたら、待ちはそちらが解く。
      if (request === openRequest) document.dispatchEvent(new CustomEvent("conversation-open-failed"));
      throw error;
    }
    if (request !== openRequest) return;
    currentHistoryId = id;
    markCurrent();
    // 会話の送受信は conversation-opened を受けて、会話の領域をこのメッセージで置き換え、今の会話にする。
    document.dispatchEvent(new CustomEvent("conversation-opened", { detail: { conversationId: id, messages } }));
  }

  async function deleteConversation(conversation, button) {
    // 取り消せないので、確かめてから送る。取りやめたら何も送らない。
    if (!window.confirm(`「${conversation.title}」を削除します。取り消せません。よろしいですか?`)) return;
    button.disabled = true;
    deleteError.hidden = true;
    let response;
    try {
      response = await fetch(`/api/conversations/${conversation.id}`, { method: "DELETE" });
    } catch (error) {
      // サーバに届かなかった。消えたかどうか分からないので、一覧から外さない。
      deleteError.hidden = false;
      button.disabled = false;
      throw error;
    }
    if (!response.ok) {
      // 消えていないものを一覧から外すと、消えたように見えてしまう。
      deleteError.hidden = false;
      button.disabled = false;
      throw new Error(`DELETE /api/conversations/${conversation.id}: ${response.status}`);
    }
    // 待っている間に一覧を読み直していたら、押した項目はもう別の要素になっている。今の一覧から id で探す。
    for (const item of historyList.children) {
      if (Number(item.dataset.conversationId) === conversation.id) item.remove();
    }
    historyEmpty.hidden = historyList.children.length > 0;
    // 消す前に読み始めた会話は、読み終えても開かない。開くと、消えた id で送ってしまう。
    // 開かないので、会話の送受信の待ちは、開けなかったときと同じく conversation-open-failed で解く (会話の領域は前の会話のまま)。
    if (openingId === conversation.id) {
      openRequest++;
      document.dispatchEvent(new CustomEvent("conversation-open-failed"));
    }
    // 消す前に始めた読み直しは、消した会話を一覧に戻してしまう。記録の今の一覧で置き換える。
    loadHistory();
    // 会話の送受信は conversation-deleted を受けて、消した会話を開いていたら新しい会話にする (conversation-new が返ってくる)。
    document.dispatchEvent(new CustomEvent("conversation-deleted", { detail: { conversationId: conversation.id } }));
  }

  // 会話の送受信は、送信が成功するたびに document へ conversation-updated を送る。
  // shown は、その会話を今も会話の領域に出しているか (送っている間に別の会話を開いていないか)。
  document.addEventListener("conversation-updated", (event) => {
    if (event.detail.shown) currentHistoryId = event.detail.conversationId;
    loadHistory();
  });
  // 新しい会話はまだ記録に無いので、一覧のどの会話も今の会話ではなくなる。開いている途中の会話も開かない。
  document.addEventListener("conversation-new", () => {
    openRequest++;
    currentHistoryId = null;
    markCurrent();
  });
  loadHistory();

  const chatMessages = document.getElementById("messages");
  const composer = document.getElementById("composer");
  const composerText = composer.elements.text;
  const sendButton = composer.querySelector("button");
  const newConversationButton = document.getElementById("new-conversation");
  const SPEAKERS = { user: "あなた", assistant: "AI" };
  // 今の会話の id。まだ 1 通も送っていない新しい会話では null。
  let currentConversationId = null;
  // 会話の領域に出している会話が変わるたびに増やす。送信中に別の会話を開いたり新しい会話にしたりしたら、前の会話の応答をここに出さない。
  let chatView = 0;
  // 送れなかった送信の、記録されていない自分の吹き出しとその後の表示。
  let unsent = [];
  // 今の会話の最初の自分の発言。履歴の題名がまだ届いていない会話を知らせで示すのに使う。
  let currentFirstText = null;
  // 履歴の一覧での会話の題名 (history-loaded で受け取る)。
  const conversationTitles = new Map();
  const sendFailures = document.getElementById("send-failures");
  // 履歴で選んだ会話を開いている途中なら、開き終わるか開けなかったと分かるときに解ける約束。開いていなければ null。
  let opening = null;

  function settleOpening() {
    opening?.resolve();
    opening = null;
  }

  // 送ったときの会話を、結果が返った今も会話の領域に出しているか。
  // 別の会話を開いている途中なら、その結果が分かるまで待つ。開いたら、送った会話のものとして領域の外に知らせる。
  async function stillShown(view) {
    while (opening) await opening.promise;
    return view === chatView;
  }

  // 送っている間に別の会話を開いてから、送った会話を開き直していまも出しているか。stillShown の後に呼ぶ。
  // 開き直した領域は記録から読み直したもので、送れなかった吹き出しは無い。出し直して、同じ会話のままの失敗として入力欄に戻す (#48)。
  // 新しい会話 (null) は開き直せないので、いま新しい会話を出していても送った会話とは別のもの。
  function reopened(origin) {
    return origin.conversationId !== null && origin.conversationId === currentConversationId;
  }

  // AI の応答の原文を Markdown のブロックとして読み、吹き出しの本文に並べる要素を返す。記録は原文のままで、出すたびにここで組み立てる。
  // 解釈するのは見出しと段落 (段落の中の改行は br) と箇条書きだけ。ほかの書式や HTML のタグは、書かれたままの文字として段落に入れる。
  // 箇条書きは、印 (-・*・+ か、数字と .) の後に空白が続く行。前の項目の印より 2 文字以上深く字下げした項目は、その項目の中の入れ子のリストにする。
  // 入れ子は何段でも同じ規則で深くする。
  // コードのフェンス (``` や ~~~) から閉じるフェンスまでは解釈せず、フェンスの行も空行も含めて書かれたままの 1 つの段落にする。
  function markdownBlocks(text) {
    const blocks = [];
    // 今の段落。空行と見出しとフェンスで閉じる。
    let paragraph = null;
    // 開いているフェンスの記号の並び (```` ``` ```` など)。閉じるまで、または応答の終わりまで続く。
    let fence = null;
    // 開いている箇条書き。外側から順に、項目の印の位置 (字下げの幅)・リストの要素・最後の項目。空行を挟んでも続く。
    let lists = [];
    for (const line of text.split(/\r?\n/)) {
      if (fence) {
        paragraph.append(document.createElement("br"), line);
        const closing = /^ {0,3}(`{3,}|~{3,})[ \t]*$/.exec(line);
        if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length) {
          fence = null;
          paragraph = null;
        }
        continue;
      }
      const opening = /^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line);
      if (opening && !(opening[1][0] === "`" && opening[2].includes("`"))) {
        fence = opening[1];
        lists = [];
        paragraph = document.createElement("p");
        paragraph.append(line);
        blocks.push(paragraph);
        continue;
      }
      // 文の後ろで開くフェンス (`前置き ```python` など)。Markdown ではフェンスではないが、続く行を見出しにすると
      // コードの # が消える。フェンスとみなしても、文字が書かれたまま出るだけで何も失わない。
      const trailing = /(?:^|[^`~])(`{3,}|~{3,})[\w+#.-]*[ \t]*$/.exec(line);
      if (trailing && !line.slice(0, trailing.index + 1).includes(trailing[1])) {
        fence = trailing[1];
        lists = [];
        if (paragraph) {
          paragraph.append(document.createElement("br"), line);
        } else {
          paragraph = document.createElement("p");
          paragraph.append(line);
          blocks.push(paragraph);
        }
        continue;
      }
      const heading = /^(#{1,6})[ \t]+(\S.*)$/.exec(line);
      const item = /^([ \t]*)([-*+]|\d{1,9}\.)[ \t]+(\S.*)$/.exec(line);
      if (heading) {
        const element = document.createElement(`h${heading[1].length}`);
        element.textContent = heading[2].trimEnd();
        blocks.push(element);
        paragraph = null;
        lists = [];
      } else if (item) {
        const indent = indentWidth(item[1]);
        const tag = item[2].endsWith(".") ? "ol" : "ul";
        // 印の位置がこの項目より深い段は閉じる。残った一番深い段より 2 文字以上深ければ、その段の最後の項目の中の入れ子にする。
        let closed = null;
        while (lists.length && lists.at(-1).indent > indent) closed = lists.pop();
        const parent = lists.at(-1);
        const nested = parent && indent >= parent.indent + 2;
        let level = parent;
        if (nested) {
          // 閉じた段がその項目の中の最後のリストなら、字下げが少し浅くなってもそこに続ける (`    - ` の後の `  - `)。
          level = closed && parent.item.lastElementChild === closed.list ? closed : null;
          if (level) {
            level.indent = indent;
            lists.push(level);
          }
        }
        // 同じ段でも、印の種類 (- などと数字) が変わったら別のリストにする。
        if (!level || level.list.localName !== tag) {
          const list = document.createElement(tag);
          const start = Number.parseInt(item[2], 10);
          if (tag === "ol" && start !== 1) list.start = start;
          if (nested) {
            parent.item.append(list);
          } else if (level?.list.parentNode) {
            // 一番外の段のリストはまだどこにも入っていないので、after が効かない。blocks に足す。
            level.list.after(list);
          } else {
            blocks.push(list);
          }
          if (level) lists.pop();
          level = { indent, list, item: null };
          lists.push(level);
        }
        level.item = document.createElement("li");
        level.item.append(item[3]);
        level.list.append(level.item);
        paragraph = level.item;
      } else if (!line.trim()) {
        paragraph = null;
      } else if (paragraph) {
        // 空行を挟まずに続く行は、段落でも項目でも、その続き。項目の続きの行の字下げは出さない。
        paragraph.append(document.createElement("br"), lists.length ? line.trimStart() : line);
      } else {
        // 空行の後の行は、項目の印より 2 文字以上深く字下げしていれば、その項目の中の段落。そうでなければ箇条書きを閉じる。
        const indent = indentWidth(/^[ \t]*/.exec(line)[0]);
        while (lists.length && indent < lists.at(-1).indent + 2) lists.pop();
        paragraph = document.createElement("p");
        if (lists.length) {
          paragraph.append(line.trimStart());
          lists.at(-1).item.append(paragraph);
        } else {
          paragraph.append(line);
          blocks.push(paragraph);
        }
      }
    }
    return blocks;
  }

  // 行頭の空白とタブの幅。タブは次の 4 の倍数の位置まで進める。
  function indentWidth(indent) {
    let width = 0;
    for (const char of indent) width = char === "\t" ? width + 4 - (width % 4) : width + 1;
    return width;
  }

  function addBubble(role, text) {
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    const speaker = document.createElement("span");
    speaker.className = "speaker";
    speaker.textContent = SPEAKERS[role];
    // 自分の発言は打ったとおりの文字で出す。
    let body;
    if (role === "assistant") {
      body = document.createElement("div");
      body.append(...markdownBlocks(text));
    } else {
      body = document.createElement("p");
      body.textContent = text;
    }
    body.className = "text";
    bubble.append(speaker, body);
    chatMessages.append(bubble);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return bubble;
  }

  // 送れなかった応答の本文の error。本文が JSON でない (届く前の代理など) ときは null。
  async function errorOf(response) {
    try {
      return (await response.json()).error ?? null;
    } catch {
      return null;
    }
  }

  // 送れなかった理由の表示。API が返す理由ごとに、次に何をすればよいかが分かる文言にする。
  const failureReasons = {
    llm_key_rejected: "AI の鍵 (ANTHROPIC_API_KEY) が正しくありません。鍵を直してから送り直してください",
    llm_busy: "AI が混んでいます。少し待ってから送り直してください",
    llm_unavailable: "AI に繋がりません",
  };

  function failureReason(error) {
    return failureReasons[error] ?? "送信できませんでした";
  }

  // AI に届かなかった、または鍵を断られた理由。混んでいるときは AI に届いているので含めない。
  const llmUnreachedErrors = ["llm_unavailable", "llm_key_rejected"];

  // 送った結果を、どの会話を出していても状態のメニューの「AI への接続」に知らせる。通常の送信も、送れなかった知らせからの送り直しもここを通す。
  // 応答が返ったら正常、AI に届かずに (または鍵を断られて) 断られたら異常。それ以外の断り (混んでいる、元の会話が無いなど) では変えない。サーバに届かないときは呼ばない。
  function reportSent(ok, error) {
    if (ok) document.dispatchEvent(new CustomEvent("llm-reached", { detail: { ok: true } }));
    else if (llmUnreachedErrors.includes(error)) document.dispatchEvent(new CustomEvent("llm-reached", { detail: { ok: false } }));
  }

  function showUnsent(bubble, text, message) {
    const notice = document.createElement("p");
    notice.className = "error";
    notice.setAttribute("role", "alert");
    notice.textContent = `${message}。もう一度送信できます。`;
    bubble.after(notice);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    unsent = [bubble, notice];
    // 待っている間に新しく打ち始めていたら、それを消さない。送った本文は吹き出しに残っている。
    if (!composerText.value) composerText.value = text;
  }

  // 送っている間に別の会話を開き、そのままなら、送れなかったことを会話の領域の外に知らせる。
  // 開いた会話の入力欄にも吹き出しにも入れないので、開いた会話へ誤って送られない。会話を切り替えても消えない。
  function showUnsentElsewhere(origin, text, message) {
    const item = document.createElement("li");
    item.setAttribute("role", "alert");
    const summary = document.createElement("p");
    summary.className = "summary";
    const originTitle = document.createElement("span");
    originTitle.className = "origin";
    originTitle.textContent = origin.conversationId === null
      ? "新しい会話"
      : conversationTitles.get(origin.conversationId) ?? origin.firstText;
    const describe = (reason) => summary.replaceChildren(`${reason}。「`, originTitle, "」に送ったメッセージは記録されていません:");
    describe(message);
    const body = document.createElement("p");
    body.className = "text";
    body.textContent = text;
    const dismiss = () => {
      item.remove();
      sendFailures.hidden = sendFailures.children.length === 0;
    };
    const resend = document.createElement("button");
    resend.type = "button";
    resend.textContent = "元の会話へ送り直す";
    resend.addEventListener("click", async () => {
      // 送り直しの最中は押せない。同じ本文を 2 回記録しない。
      resend.disabled = true;
      const view = chatView;
      try {
        let response;
        try {
          // 送り先は知らせが持つ元の会話だけ。今開いている会話の id は使わない。
          response = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conversation_id: origin.conversationId, text }),
          });
        } catch (error) {
          describe("AI に繋がりません");
          throw error;
        }
        if (!response.ok) {
          // 元の会話が無くなっていても (conversation_not_found)、ほかの会話へは送らずに知らせに残す。
          const error = await errorOf(response);
          describe(failureReason(error));
          reportSent(false, error);
          throw new Error(`POST /api/messages: ${response.status} ${error}`);
        }
        const { conversation_id, messages } = await response.json();
        dismiss();
        // 元の会話を今も開いていれば、その吹き出しに足す。別の会話を開いていたら、会話の領域は変えない。
        const shown = view === chatView && origin.conversationId !== null && origin.conversationId === currentConversationId;
        if (shown) for (const message of messages) addBubble(message.role, message.text);
        document.dispatchEvent(new CustomEvent("conversation-updated", { detail: { conversationId: conversation_id, shown } }));
        reportSent(true);
      } finally {
        resend.disabled = false;
      }
    });
    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "閉じる";
    close.addEventListener("click", dismiss);
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(resend, close);
    item.append(summary, body, actions);
    sendFailures.append(item);
    sendFailures.hidden = false;
  }

  async function sendMessage() {
    const text = composerText.value;
    if (sendButton.disabled || !text.trim()) return;
    sendButton.disabled = true;
    composerText.value = "";
    // 前に送れなかった吹き出しは記録されていない。送り直す分の吹き出しで置き換え、同じ発言を重ねない。
    unsent.forEach((element) => element.remove());
    unsent = [];
    const bubble = addBubble("user", text);
    const view = chatView;
    const origin = { conversationId: currentConversationId, firstText: currentFirstText ?? text };
    try {
      let response;
      try {
        response = await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_id: currentConversationId, text }),
        });
      } catch (error) {
        // サーバに届かない。AI に繋がらないときと同じく、送った本文は記録されていない。
        if (await stillShown(view)) showUnsent(bubble, text, "AI に繋がりません");
        else if (reopened(origin)) showUnsent(addBubble("user", text), text, "AI に繋がりません");
        else showUnsentElsewhere(origin, text, "AI に繋がりません");
        throw error;
      }
      if (!response.ok) {
        const error = await errorOf(response);
        const message = failureReason(error);
        // 送っている間に別の会話を開いたままなら、送れなかった表示も本文も、開いた会話には出さない。
        if (await stillShown(view)) showUnsent(bubble, text, message);
        else if (reopened(origin)) showUnsent(addBubble("user", text), text, message);
        else showUnsentElsewhere(origin, text, message);
        // AI に繋がらなかったことは、どの会話を出していてもサーバの状態に知らせる。
        reportSent(false, error);
        throw new Error(`POST /api/messages: ${response.status} ${error}`);
      }
      const { conversation_id, messages } = await response.json();
      const shown = await stillShown(view);
      if (shown) {
        // 自分の吹き出しはもう出ているので、AI の応答だけを足す。
        addBubble("assistant", messages[messages.length - 1].text);
        currentFirstText ??= text;
        currentConversationId = conversation_id;
      }
      document.dispatchEvent(new CustomEvent("conversation-updated", { detail: { conversationId: conversation_id, shown } }));
      reportSent(true);
    } finally {
      sendButton.disabled = false;
      composerText.focus();
    }
  }

  document.addEventListener("conversation-opened", (event) => {
    const { conversationId, messages } = event.detail;
    chatView++;
    settleOpening();
    // 送れなかった吹き出しも、前の会話のものなので一緒に消える。
    chatMessages.replaceChildren();
    unsent = [];
    for (const message of messages) addBubble(message.role, message.text);
    currentConversationId = conversationId;
    currentFirstText = messages.find((message) => message.role === "user")?.text ?? null;
  });

  // 押しただけでは会話を作らない。次の送信が conversation_id: null で送られ、成功したときに記録される。
  newConversationButton.addEventListener("click", () => {
    chatView++;
    settleOpening();
    // 送れなかった表示も会話の領域の中にあるので、吹き出しと一緒に消える。
    chatMessages.replaceChildren();
    unsent = [];
    composerText.value = "";
    currentConversationId = null;
    currentFirstText = null;
    document.dispatchEvent(new CustomEvent("conversation-new"));
    composerText.focus();
  });
  // 開いている会話が消えたら、新しい会話を押したときと同じにする。消えた id は、次に作る会話に使い直されることがあるので、その id では送らない。
  document.addEventListener("conversation-deleted", (event) => {
    if (event.detail.conversationId === currentConversationId) newConversationButton.click();
  });

  document.addEventListener("conversation-opening", () => {
    if (opening) return;
    let resolve;
    const promise = new Promise((r) => { resolve = r; });
    opening = { promise, resolve };
  });
  document.addEventListener("conversation-open-failed", settleOpening);

  document.addEventListener("history-loaded", (event) => {
    for (const { conversationId, title } of event.detail.titles) conversationTitles.set(conversationId, title);
  });

  composer.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage();
  });
  composerText.addEventListener("keydown", (event) => {
    // 変換中の Enter は確定に使うので送らない。
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendMessage();
    }
  });

  const statusList = document.getElementById("status-items");
  const statusUnreachable = document.querySelector("#status .status-unreachable");
  const statusUnreadable = document.querySelector("#status .status-unreadable");
  const recheckButton = document.getElementById("recheck");
  // 確かめている途中か。ボタンを押せないだけでなく、タブに戻ったときも新しい確かめを重ねない。
  let statusLoading = false;
  // 会話の送受信が送信の結果から知らせる、AI に繋がらなかったこと。トークンを使わない確かめは通るのに送信は
  // 失敗することがあるので、次の送信が成功するか再確認を押すまで、確かめの結果より優先して「異常」と出す。
  let llmFailedOnSend = false;

  function setState(state, ok) {
    state.className = `state ${ok ? "ok" : "ng"}`;
    state.textContent = ok ? "正常" : "異常";
  }

  // 読めなかった理由を 1 つだけ出す。null なら、どちらも出さない。
  function showStatusNotice(notice) {
    statusUnreachable.hidden = notice !== statusUnreachable;
    statusUnreadable.hidden = notice !== statusUnreadable;
  }

  function showStatusError(notice) {
    // 前の結果を残すと、読めていないのに「正常」と見えてしまう。
    statusList.replaceChildren();
    showStatusNotice(notice);
  }

  async function loadStatus() {
    if (statusLoading) return;
    statusLoading = true;
    recheckButton.disabled = true;
    try {
      let response;
      try {
        response = await fetch("/api/status");
      } catch (error) {
        // fetch が例外を出すのは、サーバに届かない (止まっている、ポートが閉じている) とき。
        showStatusError(statusUnreachable);
        throw error;
      }
      let items;
      try {
        if (!response.ok) throw new Error(`GET /api/status: ${response.status}`);
        ({ items } = await response.json());
      } catch (error) {
        // 届いたが読めなかった。
        showStatusError(statusUnreadable);
        throw error;
      }
      statusList.replaceChildren(...items.map((item) => {
        const row = document.createElement("li");
        row.dataset.key = item.key;
        const label = document.createElement("span");
        label.textContent = item.label;
        const state = document.createElement("span");
        setState(state, item.ok && !(item.key === "llm" && llmFailedOnSend));
        row.append(label, state);
        return row;
      }));
      showStatusNotice(null);
    } finally {
      statusLoading = false;
      recheckButton.disabled = false;
    }
  }

  // 再確認を押したら、送信の結果ではなく確かめの結果を出す。listener は登録順に呼ばれるので、loadStatus より先に登録する。
  recheckButton.addEventListener("click", () => {
    llmFailedOnSend = false;
  });
  recheckButton.addEventListener("click", loadStatus);
  // 送信の結果は、トークンを余計に使わずに得られる最新の証拠なので、確かめ直さずに「AI への接続」だけを変える。
  // 「アプリ自身」と「会話の記録」は、送信の失敗だけでは変えない。
  document.addEventListener("llm-reached", (event) => {
    llmFailedOnSend = !event.detail.ok;
    const state = statusList.querySelector('[data-key="llm"] .state');
    if (state) setState(state, event.detail.ok);
  });
  // 時間で繰り返しては確かめない。タブに戻ったときは、DEN さんが状態を見ようとする時点なので確かめ直す。
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") loadStatus();
  });
  loadStatus();
</script>
</body>
</html>
