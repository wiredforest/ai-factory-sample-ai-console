name: tests

on:
  pull_request:
  push:
    branches: [main]

# リポジトリの Actions 設定は selected で、actions/checkout・actions/setup-python・
# astral-sh/setup-uv だけを許可している。ほかの外部 action を足すときは設定も変えること。
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
      - run: uv run python harness/ci.py
